app.jwt.secret=ThisIsATestSecretKeyForReadHubTestingPurposesOnlyMustBeHS512SafeLength12345
app.jwtSecret=ThisIsATestSecretKeyForReadHubTestingPurposesOnlyMustBeHS512SafeLength12345

