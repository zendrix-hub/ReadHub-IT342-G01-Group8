# ===============================
# DATABASE CONFIGURATION - TEST
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_TEST_URL:jdbc:h2:mem:readhub_test;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_TEST_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_TEST_PASSWORD:}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

