spring.profiles.active=dev

# ===============================
# JWT CONFIGURATION
# ===============================
app.jwt.expiration-ms=86400000
app.jwtExpirationMs=86400000

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=${PORT:8080}
server.error.include-message=always

# ===============================
# EMAIL CONFIGURATION
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# ===============================
# STORAGE CONFIGURATION
# ===============================
app.storage.type=${APP_STORAGE_TYPE:local}
app.server.base-url=${APP_SERVER_BASE_URL:http://localhost:8080}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ===============================
# JACKSON CONFIGURATION
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================
# CORS CONFIGURATION
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===============================
# ACTUATOR CONFIGURATION
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
# Exclude mail from health check - SMTP credentials may vary per environment
management.health.mail.enabled=false

# ===============================
# DATABASE CONNECTION POOL (HIKARICP)
# ===============================
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=ReadHubHikariCP